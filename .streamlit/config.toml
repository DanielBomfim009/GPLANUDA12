[theme]
base = "dark"
primaryColor = "#5b8def"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#12172a"
textColor = "#f4f6fb"
font = "sans serif"

[server]
headless = true
# Recarrega sozinho quando o codigo muda, em vez de perguntar "Source file
# changed" e esperar clique. No Render nao muda nada: la o arquivo e fixo.
runOnSave = true
